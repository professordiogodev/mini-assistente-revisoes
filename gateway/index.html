<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Mini-Assistente</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; background: #f6f7fb; color: #1d1f27; }
    h1 { margin-bottom: 4px; }
    .sub { color: #666; margin-top: 0; }
    .estado { display: flex; gap: 12px; margin: 16px 0; }
    .pill { padding: 6px 12px; border-radius: 999px; font-size: 14px; background: #ddd; }
    .ok { background: #c8f2d0; } .mal { background: #f7c9c9; }
    form { display: flex; gap: 8px; }
    input { flex: 1; padding: 10px; font-size: 16px; border: 1px solid #bbb; border-radius: 8px; }
    button { padding: 10px 18px; font-size: 16px; border: 0; border-radius: 8px; background: #3b5bdb; color: white; cursor: pointer; }
    .cartao { background: white; border-radius: 10px; padding: 16px; margin-top: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .cartao h3 { margin: 0 0 8px; font-size: 15px; color: #555; }
    .cartao p { margin: 0; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>🤖 Mini-Assistente</h1>
  <p class="sub">3 micro-serviços em Python: gateway → bigramas + LLM (Ollama)</p>

  <div class="estado">
    <span id="est-bigramas" class="pill">bigramas: ?</span>
    <span id="est-llm" class="pill">llm: ?</span>
  </div>

  <form id="form">
    <input id="texto" placeholder="Ex.: O que faz o modelo" autocomplete="off" required>
    <button>Enviar</button>
  </form>

  <div class="cartao">
    <h3>📊 Bigramas — próxima palavra prevista para a tua última palavra</h3>
    <p id="sugestao">—</p>
  </div>
  <div class="cartao">
    <h3>🧠 LLM — resposta do teu assistente</h3>
    <p id="resposta">—</p>
  </div>

  <script>
    async function verEstado() {
      const r = await fetch("/api/estado");
      const e = await r.json();
      for (const nome of ["bigramas", "llm"]) {
        const el = document.getElementById("est-" + nome);
        el.textContent = nome + ": " + (e[nome] ? "ligado" : "desligado");
        el.className = "pill " + (e[nome] ? "ok" : "mal");
      }
    }

    document.getElementById("form").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const texto = document.getElementById("texto").value;
      document.getElementById("sugestao").textContent = "a pensar...";
      document.getElementById("resposta").textContent = "a pensar... (pode demorar)";
      const r = await fetch("/api/perguntar?texto=" + encodeURIComponent(texto));
      const d = await r.json();
      document.getElementById("sugestao").textContent = d.sugestao_bigramas ?? "(palavra desconhecida no corpus)";
      document.getElementById("resposta").textContent = d.resposta_llm;
      verEstado();
    });

    verEstado();
    setInterval(verEstado, 3000);
  </script>
</body>
</html>
